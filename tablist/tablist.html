<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tablist Export</title>
    <script src="../tablist/tablist.js"></script>
    <link href="../tablist/tablist.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <header class="export-header">
      <div class="export-header-inner">
        <h1 class="export-title">Exported Tabs</h1>
        <span class="export-timestamp" id="export-timestamp"></span>
        <button type="button" class="copy-btn" id="copy-btn">Copy all</button>
      </div>
    </header>
    <main class="export-main">
      <div class="export-block">
        <ul class="urlist"></ul>
      </div>
    </main>
  </body>
</html>
